<script>
/* ==========================================================================
   Slots — single payline, three reels sharing one 31-stop strip.
   Verified return to player: 94.95%. Top award 500x.
   ========================================================================== */

Games.slots = {
  name: 'Slots',
  glyph: '🍒',
  tint: '#FF2D55',
  sub: 'One payline · 500× jackpot',

  build(api) {
    const SYM = {
      cherry:  { g: '🍒', pay: 6 },
      lemon:   { g: '🍋', pay: 10 },
      bell:    { g: '🔔', pay: 20 },
      star:    { g: '⭐', pay: 40 },
      diamond: { g: '💎', pay: 150 },
      seven:   { g: '7️⃣', pay: 500 },
    };

    // 31 stops: cherry 8, lemon 7, bell 6, star 5, diamond 3, seven 2
    const STRIP = [
      'cherry','lemon','bell','cherry','star','lemon','diamond','cherry','bell','lemon',
      'seven','cherry','star','bell','lemon','cherry','diamond','lemon','bell','cherry',
      'star','lemon','bell','cherry','diamond','star','lemon','cherry','bell','star','seven',
    ];
    const SYM_H = 82;
    const CYCLE = STRIP.length * SYM_H;

    let bet = Math.min(Store.ECON.DEFAULT_BET, Math.max(Store.ECON.MIN_BET, Store.balance));
    let spinning = false;

    /* ======================= View ======================= */
    const stage = el('div', { class: 'table__stage' });
    const msg = el('div', { class: 'table__msg' });

    const reels = [0, 1, 2].map(() => {
      const strip = el('div', { class: 'reel__strip' });
      // rendered twice so the drum can wrap without a seam
      for (let pass = 0; pass < 2; pass++)
        STRIP.forEach(k => strip.appendChild(el('div', { class: 'reel__sym', text: SYM[k].g })));
      const box = el('div', { class: 'reel' }, [strip]);
      return { box, strip, offset: 0, landed: 0 };
    });

    const windowBox = el('div', { class: 'slot__window' }, reels.map(r => r.box));
    const lever = el('div', { class: 'slot__lever' });
    const cab = el('div', { class: 'slot__cab' }, [windowBox, lever]);

    const payCells = {};
    const paytable = el('div', { class: 'paytable' },
      ['seven', 'diamond', 'star', 'bell', 'lemon', 'cherry'].map(k => {
        const c = el('div', { class: 'paytable__cell' }, [
          el('b', { text: SYM[k].g.repeat(3) }),
          el('span', { text: `×${SYM[k].pay}` }),
        ]);
        payCells[k] = c;
        return c;
      })
    );

    stage.append(msg, el('div', { class: 'slot' }, [cab, paytable]));

    /* ---- Controls ---- */
    const stepper = betStepper(() => bet, v => bet = v);
    const bSpin = el('button', { class: 'gbtn gbtn--gold', onclick: () => spin() }, [
      el('span', { text: 'Spin' }),
    ]);
    const dock = el('div', { class: 'dock' }, [
      stepper,
      el('div', { class: 'dock__row' }, [bSpin]),
    ]);

    function setOffset(r) {
      r.strip.style.transform = `translateY(${-(r.offset % CYCLE)}px)`;
    }
    reels.forEach(r => { r.offset = 0; setOffset(r); });

    function say(t, flash = true) {
      msg.textContent = t;
      if (flash) { msg.classList.remove('flash'); void msg.offsetWidth; msg.classList.add('flash'); }
    }

    function clearHighlights() {
      $$('.reel__sym.hit', stage).forEach(n => n.classList.remove('hit'));
      Object.values(payCells).forEach(c => c.classList.remove('lit'));
      windowBox.classList.remove('hot');
      cab.classList.remove('win-glow');
    }

    function controls() {
      stepper._refresh?.();
      bSpin.disabled = spinning || !Store.canBet(bet);
    }

    /* ======================= Spin ======================= */
    /** Animate one reel: free spin, then ease into the landing stop. */
    function runReel(r, stopIndex, spinMs, landMs) {
      return new Promise(resolve => {
        const startOffset = r.offset;
        const speed = 3.1;                       // px per ms during free spin
        const freeDist = speed * spinMs;
        // land so strip index `stopIndex` sits in the middle window row
        const wantMod = ((stopIndex - 1) * SYM_H % CYCLE + CYCLE) % CYCLE;
        const roughEnd = startOffset + freeDist;
        let target = roughEnd - (roughEnd % CYCLE) + wantMod;
        while (target < roughEnd + CYCLE * 0.6) target += CYCLE;

        const total = spinMs + landMs;
        const t0 = performance.now();
        r.box.classList.add('spinning', 'fast');

        let lastTick = 0;
        function frame(now) {
          const t = now - t0;
          if (t < spinMs) {
            r.offset = startOffset + speed * t;
            if (t > spinMs - 260) r.box.classList.remove('fast');
            if (t - lastTick > 90) { lastTick = t; Sfx.tick(); }
          } else {
            const k = clamp((t - spinMs) / landMs, 0, 1);
            // ease out with a small settle overshoot
            const e = k < 1
              ? 1 - Math.pow(1 - k, 3.2)
              : 1;
            const overshoot = Math.sin(k * Math.PI) * 0.045 * (1 - k);
            const from = startOffset + freeDist;
            r.offset = from + (target - from) * (e + overshoot);
          }
          setOffset(r);
          if (t < total) requestAnimationFrame(frame);
          else {
            r.offset = target;
            setOffset(r);
            r.landed = stopIndex;
            r.box.classList.remove('spinning', 'fast');
            r.box.classList.add('landed');
            setTimeout(() => r.box.classList.remove('landed'), 320);
            Sfx.chip(); Haptic.light();
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    /** Mark the centered symbol node on a reel. */
    function markCenter(r) {
      const idx = r.landed;
      const nodes = r.strip.children;
      [idx, idx + STRIP.length].forEach(n => nodes[n]?.classList.add('hit'));
    }

    async function spin() {
      if (spinning) return;
      if (!Store.canBet(bet)) {
        if (Store.balance < Store.ECON.MIN_BET) brokeSheet();
        else toast(`You only have ${Store.fmt(Store.balance)}`);
        return;
      }
      spinning = true;
      clearHighlights();
      const staked = Store.wager('slots', bet);
      controls();
      say('Spinning…', false);

      cab.classList.add('pulled');
      setTimeout(() => cab.classList.remove('pulled'), 340);
      Sfx.spin(); Haptic.light();

      const stops = [0, 1, 2].map(() => Math.floor(Math.random() * STRIP.length));

      await Promise.all([
        runReel(reels[0], stops[0], 900, 620),
        runReel(reels[1], stops[1], 1240, 640),
        runReel(reels[2], stops[2], 1600, 700),
      ]);

      const line = stops.map(i => STRIP[i]);
      const cherries = line.filter(k => k === 'cherry').length;

      let mult = 0, label = '';
      if (line[0] === line[1] && line[1] === line[2]) {
        mult = SYM[line[0]].pay;
        label = `${SYM[line[0]].g.repeat(3)}`;
        markCenter(reels[0]); markCenter(reels[1]); markCenter(reels[2]);
        payCells[line[0]].classList.add('lit');
      } else if (cherries === 2) {
        mult = 1;
        label = 'Two cherries';
        reels.forEach(r => { if (STRIP[r.landed] === 'cherry') markCenter(r); });
      }

      const returned = Math.round(staked * mult);
      if (returned > 0) Store.payout('slots', returned);
      const net = Store.settle('slots', staked, returned, `Slots ${label || 'no line'}`);

      if (mult >= 40) {
        windowBox.classList.add('hot');
        cab.classList.add('win-glow');
        say(`${label} — ${mult}×!`);
        FX.flash(stage);
        FX.pop(stage, `+${Store.fmt(net)}`, 'jackpot', '50%', '38%');
        FX.burst(stage, { count: mult >= 150 ? 52 : 34 });
        Sfx.bigwin(); Haptic.win();
      } else if (net > 0) {
        windowBox.classList.add('hot');
        say(`${label} — ${mult}×`);
        FX.pop(stage, `+${Store.fmt(net)}`, 'win', '50%', '38%');
        FX.burst(stage, { count: 14 });
        Sfx.win(); Haptic.win();
      } else if (mult === 1) {
        say('Two cherries — bet back');
        FX.pop(stage, '±0', 'win', '50%', '38%');
        Sfx.tick();
      } else {
        say('No line');
        Sfx.lose(); Haptic.tap();
      }

      spinning = false;
      bet = Math.min(bet, Math.max(Store.ECON.MIN_BET, Store.balance));
      controls();
      if (Store.balance < Store.ECON.MIN_BET) setTimeout(brokeSheet, 1100);
    }

    const nav = gameNavbar('Slots', api.pop);
    const node = el('div', {}, [nav, el('div', { class: 'table' }, [stage, dock])]);
    say('Pull for three of a kind');
    controls();

    return { node, onPop: () => nav._unsub?.() };
  },
};

</script>

<script>
/* ==========================================================================
   Roulette — European single zero (37 pockets), 2.70% house edge.
   The ball spirals in, rattles, then locks into the winning pocket and
   rides the wheel as it coasts down.
   ========================================================================== */

Games.roulette = {
  name: 'Roulette',
  glyph: '🎡',
  tint: '#AF52DE',
  sub: 'Single zero · 35:1 straight up',

  build(api) {
    const ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,
                   24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    const N = ORDER.length;
    const SLICE = (Math.PI * 2) / N;
    const colorOf = n => n === 0 ? 'green' : RED.has(n) ? 'red' : 'black';

    /* Bet definitions: multiplier is the gross return including the stake. */
    const BETS = {
      red:   { mult: 2, test: n => n !== 0 && RED.has(n) },
      black: { mult: 2, test: n => n !== 0 && !RED.has(n) },
      odd:   { mult: 2, test: n => n !== 0 && n % 2 === 1 },
      even:  { mult: 2, test: n => n !== 0 && n % 2 === 0 },
      low:   { mult: 2, test: n => n >= 1 && n <= 18 },
      high:  { mult: 2, test: n => n >= 19 && n <= 36 },
      d1:    { mult: 3, test: n => n >= 1 && n <= 12 },
      d2:    { mult: 3, test: n => n >= 13 && n <= 24 },
      d3:    { mult: 3, test: n => n >= 25 && n <= 36 },
    };
    for (let n = 0; n <= 36; n++) BETS['n' + n] = { mult: 36, test: v => v === n };

    let chip = Math.min(Store.ECON.DEFAULT_BET, Math.max(Store.ECON.MIN_BET, Store.balance));
    let bets = {};        // key -> amount staked
    let lastBets = null;
    let spinning = false;
    let history = [];

    const totalStaked = () => Object.values(bets).reduce((a, b) => a + b, 0);

    /* ======================= Canvas wheel ======================= */
    const cv = el('canvas', { class: 'roul__canvas' });
    const ctx = cv.getContext('2d');
    const resultBadge = el('div', { class: 'roul__result', hidden: true });
    const wheelWrap = el('div', { class: 'roul__wheelwrap' }, [cv, resultBadge]);

    let wheelAngle = 0;
    let ballAngle = 0;
    let ballR = 0.86;          // fraction of radius
    let ballVisible = false;
    let size = 300;

    function fit() {
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      const r = wheelWrap.getBoundingClientRect();
      size = Math.max(180, Math.min(r.width, r.height) || 280);
      cv.width = size * dpr;
      cv.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const c = size / 2;
      const R = c - 2;
      ctx.clearRect(0, 0, size, size);

      // outer rim
      const rim = ctx.createLinearGradient(0, 0, size, size);
      rim.addColorStop(0, '#F6D87A');
      rim.addColorStop(0.5, '#C08D14');
      rim.addColorStop(1, '#8A5F06');
      ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2);
      ctx.fillStyle = rim; ctx.fill();

      ctx.beginPath(); ctx.arc(c, c, R * 0.955, 0, Math.PI * 2);
      ctx.fillStyle = '#1A1207'; ctx.fill();

      // pockets
      const rOut = R * 0.94, rIn = R * 0.66;
      for (let i = 0; i < N; i++) {
        const n = ORDER[i];
        const a0 = wheelAngle + i * SLICE - SLICE / 2;
        const a1 = a0 + SLICE;
        ctx.beginPath();
        ctx.arc(c, c, rOut, a0, a1);
        ctx.arc(c, c, rIn, a1, a0, true);
        ctx.closePath();
        const col = colorOf(n);
        ctx.fillStyle = col === 'red' ? '#B31E17' : col === 'black' ? '#17191D' : '#0C7A3E';
        ctx.fill();
        ctx.strokeStyle = 'rgba(226,196,120,0.55)';
        ctx.lineWidth = Math.max(0.6, size * 0.0035);
        ctx.stroke();

        // number
        const mid = a0 + SLICE / 2;
        ctx.save();
        ctx.translate(c + Math.cos(mid) * (rOut - (rOut - rIn) * 0.34),
                      c + Math.sin(mid) * (rOut - (rOut - rIn) * 0.34));
        ctx.rotate(mid + Math.PI / 2);
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${Math.max(7, size * 0.042)}px -apple-system, system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(n), 0, 0);
        ctx.restore();
      }

      // inner cone
      const cone = ctx.createRadialGradient(c - R * 0.2, c - R * 0.24, R * 0.05, c, c, rIn);
      cone.addColorStop(0, '#6E7681');
      cone.addColorStop(0.55, '#3A4048');
      cone.addColorStop(1, '#1A1E23');
      ctx.beginPath(); ctx.arc(c, c, rIn, 0, Math.PI * 2);
      ctx.fillStyle = cone; ctx.fill();
      ctx.strokeStyle = 'rgba(226,196,120,0.4)'; ctx.lineWidth = 1; ctx.stroke();

      // turret spokes
      ctx.save();
      ctx.translate(c, c); ctx.rotate(wheelAngle);
      ctx.strokeStyle = 'rgba(226,196,120,0.32)';
      ctx.lineWidth = Math.max(1.5, size * 0.012);
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(i * Math.PI / 2) * rIn * 0.9, Math.sin(i * Math.PI / 2) * rIn * 0.9);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, rIn * 0.2, 0, Math.PI * 2);
      const hub = ctx.createLinearGradient(-rIn * 0.2, -rIn * 0.2, rIn * 0.2, rIn * 0.2);
      hub.addColorStop(0, '#F6D87A'); hub.addColorStop(1, '#9C6D0A');
      ctx.fillStyle = hub; ctx.fill();
      ctx.restore();

      // ball
      if (ballVisible) {
        const br = Math.max(3.4, size * 0.026);
        const bx = c + Math.cos(ballAngle) * R * ballR;
        const by = c + Math.sin(ballAngle) * R * ballR;
        ctx.beginPath();
        ctx.arc(bx + br * 0.3, by + br * 0.45, br, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
        const bg = ctx.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.1, bx, by, br);
        bg.addColorStop(0, '#fff'); bg.addColorStop(0.6, '#E6E3DA'); bg.addColorStop(1, '#A9A69C');
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fillStyle = bg; ctx.fill();
      }
    }

    /* Idle drift so the wheel is never dead */
    let idleRaf = null;
    function idle() {
      if (!spinning) { wheelAngle += 0.0022; draw(); }
      idleRaf = requestAnimationFrame(idle);
    }

    /* ======================= Bet layout ======================= */
    const cells = {};
    const numsGrid = el('div', { class: 'layout__nums' });
    // standard 3x12 board: top row 3,6,9… then 2,5,8… then 1,4,7…
    [3, 2, 1].forEach(startRow => {
      for (let col = 0; col < 12; col++) {
        const n = col * 3 + startRow;
        const c = el('button', {
          class: `cell ${colorOf(n)}`,
          text: String(n),
          'aria-label': `Bet on ${n}`,
          onclick: () => place('n' + n),
        });
        cells['n' + n] = c;
        numsGrid.appendChild(c);
      }
    });

    const zeroCell = el('button', {
      class: 'layout__zero', text: '0', 'aria-label': 'Bet on zero',
      onclick: () => place('n0'),
    });
    cells['n0'] = zeroCell;

    function obet(key, label, extra = '') {
      const b = el('button', { class: `obet ${extra}`, text: label, onclick: () => place(key) });
      cells[key] = b;
      return b;
    }

    const outside = el('div', {}, [
      el('div', { class: 'layout__outside' }, [
        obet('d1', '1st 12'), obet('d2', '2nd 12'), obet('d3', '3rd 12'),
      ]),
      el('div', { class: 'layout__outside layout__outside--halves' }, [
        obet('low', '1–18'), obet('even', 'Even'),
        obet('red', 'Red', 'red-sw'), obet('black', 'Black', 'black-sw'),
      ]),
      el('div', { class: 'layout__outside layout__outside--halves' }, [
        obet('high', '19–36'), obet('odd', 'Odd'),
      ]),
    ]);

    const historyRow = el('div', { class: 'roul__history' });

    const stage = el('div', { class: 'table__stage' });
    const msg = el('div', { class: 'table__msg' });
    stage.append(msg, el('div', { class: 'roul' }, [
      wheelWrap,
      historyRow,
      el('div', { class: 'layout' }, [zeroCell, numsGrid, outside]),
    ]));

    /* ---- Controls ---- */
    const stepper = betStepper(() => chip, v => chip = v);
    const bSpin = el('button', { class: 'gbtn gbtn--gold', onclick: () => spin() }, [el('span', { text: 'Spin' })]);
    const bClear = el('button', { class: 'gbtn gbtn--sm', text: 'Clear', onclick: () => { bets = {}; paintBets(); Sfx.click(); } });
    const bRebet = el('button', { class: 'gbtn gbtn--sm', text: 'Rebet', onclick: () => rebet() });

    const dock = el('div', { class: 'dock' }, [
      stepper,
      el('div', { class: 'dock__row' }, [bClear, bRebet]),
      el('div', { class: 'dock__row' }, [bSpin]),
    ]);

    function place(key) {
      if (spinning) return;
      const staked = totalStaked();
      if (chip > Store.balance - staked) {
        toast(staked ? 'Rest of your coins are already on the table' : 'Not enough coins');
        return;
      }
      bets[key] = (bets[key] || 0) + chip;
      Sfx.chip(); Haptic.tap();
      paintBets();
    }

    function rebet() {
      if (spinning || !lastBets) { toast('No previous bet'); return; }
      const sum = Object.values(lastBets).reduce((a, b) => a + b, 0);
      if (sum > Store.balance) { toast('Not enough for that bet'); return; }
      bets = { ...lastBets };
      Sfx.chip();
      paintBets();
    }

    function paintBets(keepMsg = false) {
      Object.entries(cells).forEach(([k, node]) => {
        node.classList.toggle('staked', !!bets[k]);
        const old = $('.chipdot', node);
        if (old) old.remove();
        if (bets[k]) node.appendChild(el('span', { class: 'chipdot money', text: shortNum(bets[k]) }));
      });
      const t = totalStaked();
      bSpin.innerHTML = '';
      bSpin.appendChild(el('span', { text: t ? `Spin · ${Store.fmt(t)}` : 'Spin' }));
      bSpin.disabled = spinning || t === 0;
      bClear.disabled = spinning || t === 0;
      bRebet.disabled = spinning || !lastBets;
      stepper._refresh?.();
      if (!spinning && !keepMsg) say(t ? `${Store.fmt(t)} on the table` : 'Tap the board to bet', false);
    }

    const shortNum = n => n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);

    function say(t, flash = true) {
      msg.textContent = t;
      if (flash) { msg.classList.remove('flash'); void msg.offsetWidth; msg.classList.add('flash'); }
    }

    /* ======================= Spin ======================= */
    function spin() {
      if (spinning) return;
      const staked = totalStaked();
      if (staked <= 0) return;
      if (staked > Store.balance) { toast('Not enough coins'); return; }

      spinning = true;
      lastBets = { ...bets };
      Store.wager('roulette', staked);
      resultBadge.hidden = true;
      $$('.hit', stage).forEach(n => n.classList.remove('hit'));
      paintBets();
      say('No more bets');
      Sfx.spin(); Haptic.light();

      const idx = Math.floor(Math.random() * N);
      const winner = ORDER[idx];

      // Trajectory
      const T = 4400;                              // ball flight, ms
      const w0 = wheelAngle;
      const WT = Math.PI * 2 * 3.2;                // wheel turns during flight
      const b0 = ballAngle;
      const pocketA = idx * SLICE;

      // final ball angle must equal final wheel angle + pocket offset
      const wEnd = w0 + WT;
      let bEndWanted = wEnd + pocketA;
      const spins = Math.PI * 2 * 6;               // ball travels backwards
      let bEnd = b0 - spins;
      bEnd -= ((bEnd - bEndWanted) % (Math.PI * 2));   // align to pocket

      ballVisible = true;
      const t0 = performance.now();
      let lastPocket = -1;

      function frame(now) {
        const t = now - t0;
        const k = clamp(t / T, 0, 1);
        const easeW = 1 - Math.pow(1 - k, 2.4);
        const easeB = 1 - Math.pow(1 - k, 3.0);

        wheelAngle = w0 + WT * easeW;
        ballAngle = b0 + (bEnd - b0) * easeB;

        // radius: hugs the rim, then drops in with a couple of rattles
        let r;
        if (k < 0.55) r = 0.88 - 0.02 * (k / 0.55);
        else {
          const q = (k - 0.55) / 0.45;
          const drop = 0.86 - 0.115 * (1 - Math.pow(1 - q, 2.2));
          const rattle = Math.sin(q * Math.PI * 7) * 0.018 * (1 - q) * (1 - q);
          r = drop + rattle;
        }
        ballR = r;

        // tick as the ball passes pockets
        const pk = Math.floor(((ballAngle - wheelAngle) / SLICE) % N);
        if (pk !== lastPocket && k < 0.97) {
          lastPocket = pk;
          if (k > 0.4 || Math.random() < 0.4) Sfx.tick();
        }

        draw();
        if (t < T) requestAnimationFrame(frame);
        else coast(idx, winner);
      }
      requestAnimationFrame(frame);
    }

    function coast(idx, winner) {
      // ball rides in its pocket while the wheel slows to a stop
      const t0 = performance.now();
      const D = 1500;
      const w0 = wheelAngle;
      const drift = Math.PI * 0.55;
      const pocketA = idx * SLICE;

      function frame(now) {
        const k = clamp((now - t0) / D, 0, 1);
        wheelAngle = w0 + drift * (1 - Math.pow(1 - k, 2));
        ballAngle = wheelAngle + pocketA;
        ballR = 0.745;
        draw();
        if (k < 1) requestAnimationFrame(frame);
        else settle(winner);
      }
      requestAnimationFrame(frame);
    }

    function settle(winner) {
      const col = colorOf(winner);
      resultBadge.textContent = String(winner);
      resultBadge.className = `roul__result ${col}`;
      resultBadge.hidden = false;

      history.unshift(winner);
      if (history.length > 10) history.pop();
      historyRow.innerHTML = '';
      history.forEach(n => historyRow.appendChild(
        el('span', { class: `hchip ${colorOf(n)}`, text: String(n) })
      ));

      const staked = totalStaked();
      let returned = 0;
      const winKeys = [];
      for (const [k, amt] of Object.entries(bets)) {
        const def = BETS[k];
        if (def && def.test(winner)) { returned += amt * def.mult; winKeys.push(k); }
      }
      winKeys.forEach(k => cells[k]?.classList.add('hit'));

      if (returned > 0) Store.payout('roulette', returned);
      const net = Store.settle('roulette', staked, returned, `Roulette ${winner}`);

      if (net > 0) {
        say(`${winner} ${col} — you win`);
        FX.pop(stage, `+${Store.fmt(net)}`, net >= staked * 8 ? 'jackpot' : 'win', '50%', '30%');
        if (net >= staked * 8) { FX.flash(stage); FX.burst(stage, { count: 44, y: 0.3 }); Sfx.bigwin(); }
        else { FX.burst(stage, { count: 16, y: 0.3 }); Sfx.win(); }
        Haptic.win();
      } else {
        say(`${winner} ${col} — no win`);
        FX.pop(stage, `−${Store.fmt(staked)}`, 'lose', '50%', '30%');
        Sfx.lose(); Haptic.lose();
      }

      spinning = false;
      bets = {};
      chip = Math.min(chip, Math.max(Store.ECON.MIN_BET, Store.balance));
      paintBets(true);
      if (Store.balance < Store.ECON.MIN_BET) setTimeout(brokeSheet, 1200);
    }

    /* ---- Assemble ---- */
    const nav = gameNavbar('Roulette', api.pop);
    const node = el('div', {}, [nav, el('div', { class: 'table' }, [stage, dock])]);

    const ro = new ResizeObserver(fit);
    requestAnimationFrame(() => { fit(); ro.observe(wheelWrap); idle(); });
    paintBets();

    return {
      node,
      onPop: () => { nav._unsub?.(); ro.disconnect(); cancelAnimationFrame(idleRaf); },
    };
  },
};

</script>

<!-- js/games/craps.js -->
<script>
/* ==========================================================================
   Craps — come-out and point phases. Pass 1.41%, Don't Pass 1.36%,
   Field 5.56% (2 and 12 pay double), Any 7 pays 4:1.
   Dice are real CSS cubes: each roll lands the correct face toward you.
   ========================================================================== */

Games.craps = {
  name: 'Craps',
  glyph: '🎲',
  tint: '#FF9500',
  sub: 'Pass line · roll for the point',

  build(api) {
    /* Rotation that brings each pip face toward the viewer. */
    const FACE = {
      1: { x: 0,   y: 0 },
      2: { x: 0,   y: -90 },
      3: { x: 0,   y: 180 },
      4: { x: 0,   y: 90 },
      5: { x: -90, y: 0 },
      6: { x: 90,  y: 0 },
    };
    /* Pip positions on a 3x3 grid (1-indexed cells). */
    const PIPS = {
      1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9],
      5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9],
    };

    let chip = Math.min(Store.ECON.DEFAULT_BET, Math.max(Store.ECON.MIN_BET, Store.balance));
    let point = null;
    let line = { pass: 0, dont: 0 };
    let oneRoll = { field: 0, any7: 0 };
    let rolling = false;
    let dice = [1, 1];

    /* ======================= Dice ======================= */
    function dieEl(isRed) {
      const faces = [1, 2, 3, 4, 5, 6].map(f => {
        const cells = Array.from({ length: 9 }, (_, i) =>
          PIPS[f].includes(i + 1) ? el('i') : el('span'));
        return el('div', { class: `die__f die__f--${f}${isRed ? ' red' : ''}` }, cells);
      });
      return el('div', { class: 'die' }, faces);
    }

    const d1 = dieEl(false);
    const d2 = dieEl(true);
    const turns = [{ x: 0, y: 0 }, { x: 0, y: 0 }];

    function setDie(node, i, value) {
      const f = FACE[value];
      turns[i].x += 360 * (2 + Math.floor(Math.random() * 3));
      turns[i].y += 360 * (2 + Math.floor(Math.random() * 3));
      node.style.transform = `rotateX(${turns[i].x + f.x}deg) rotateY(${turns[i].y + f.y}deg)`;
    }
    setDie(d1, 0, 1); setDie(d2, 1, 1);

    const totalTag = el('div', { class: 'dicebowl__total', hidden: true });
    const puck = el('div', { class: 'puck puck--off', text: 'Off' });
    const bowl = el('div', { class: 'dicebowl' }, [puck, d1, d2, totalTag]);

    /* ======================= Bet buttons ======================= */
    const betDefs = [
      { key: 'pass',  name: 'Pass Line',  odds: 'Even money', line: true },
      { key: 'dont',  name: "Don't Pass", odds: 'Even money · bar 12', line: true },
      { key: 'field', name: 'Field',      odds: '3·4·9·10·11 even · 2·12 double' },
      { key: 'any7',  name: 'Any Seven',  odds: 'Pays 4 to 1' },
    ];

    const betNodes = {};
    const betsGrid = el('div', { class: 'craps__bets' }, betDefs.map(d => {
      const amt = el('span', { class: 'cbet__amt money', text: '' });
      const b = el('button', { class: 'cbet', onclick: () => place(d.key) }, [
        el('div', { class: 'cbet__name', text: d.name }),
        el('div', { class: 'cbet__odds', text: d.odds }),
        amt,
      ]);
      betNodes[d.key] = { btn: b, amt, def: d };
      return b;
    }));

    const stage = el('div', { class: 'table__stage' });
    const msg = el('div', { class: 'table__msg' });
    stage.append(msg, el('div', { class: 'craps' }, [bowl, betsGrid]));

    /* ---- Controls ---- */
    const stepper = betStepper(() => chip, v => chip = v);
    const bRoll = el('button', { class: 'gbtn gbtn--gold', text: 'Roll', onclick: () => roll() });
    const bClear = el('button', { class: 'gbtn gbtn--sm', text: 'Clear bets', onclick: () => clearBets() });

    const dock = el('div', { class: 'dock' }, [
      stepper,
      el('div', { class: 'dock__row' }, [bClear]),
      el('div', { class: 'dock__row' }, [bRoll]),
    ]);

    const staked = () => line.pass + line.dont + oneRoll.field + oneRoll.any7;

    function place(key) {
      if (rolling) return;
      if ((key === 'pass' || key === 'dont') && point !== null) {
        toast('Line bets are only open on the come-out');
        return;
      }
      if (chip > Store.balance) { toast('Not enough coins'); return; }
      Store.wager('craps', chip);
      if (key === 'pass' || key === 'dont') line[key] += chip;
      else oneRoll[key] += chip;
      Sfx.chip(); Haptic.tap();
      paint();
    }

    function clearBets() {
      if (rolling) return;
      // only refundable bets that haven't been committed to a point
      if (point !== null) { toast('Your line bet rides until the point resolves'); return; }
      const back = staked();
      if (!back) return;
      Store.payout('craps', back);
      line = { pass: 0, dont: 0 };
      oneRoll = { field: 0, any7: 0 };
      Sfx.click();
      paint();
    }

    function paint() {
      Object.entries(betNodes).forEach(([k, o]) => {
        const amt = (k === 'pass' || k === 'dont') ? line[k] : oneRoll[k];
        o.amt.textContent = amt ? Store.fmt(amt) : '';
        o.btn.classList.toggle('staked', !!amt);
        o.btn.disabled = rolling || (o.def.line && point !== null);
      });

      puck.className = 'puck ' + (point === null ? 'puck--off' : 'puck--on');
      puck.textContent = point === null ? 'Off' : String(point);

      const t = staked();
      bRoll.disabled = rolling || t === 0;
      bRoll.textContent = point === null ? 'Roll (come out)' : `Roll for ${point}`;
      bClear.disabled = rolling || t === 0 || point !== null;
      stepper._refresh?.();
    }

    function say(t, flash = true) {
      msg.textContent = t;
      if (flash) { msg.classList.remove('flash'); void msg.offsetWidth; msg.classList.add('flash'); }
    }

    /* ======================= Roll ======================= */
    async function roll() {
      if (rolling || staked() === 0) return;
      rolling = true;
      totalTag.hidden = true;
      $$('.hit', betsGrid).forEach(n => n.classList.remove('hit'));
      paint();
      say('Rolling…', false);

      d1.classList.add('rolling'); d2.classList.add('rolling');
      Sfx.roll(); Haptic.heavy();
      await wait(420);
      d1.classList.remove('rolling'); d2.classList.remove('rolling');

      dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
      setDie(d1, 0, dice[0]);
      setDie(d2, 1, dice[1]);
      await wait(1200);

      d1.classList.add('settled'); d2.classList.add('settled');
      setTimeout(() => { d1.classList.remove('settled'); d2.classList.remove('settled'); }, 420);
      Sfx.chip(); Haptic.light();

      const sum = dice[0] + dice[1];
      totalTag.textContent = `${dice[0]} + ${dice[1]} = ${sum}`;
      totalTag.hidden = false;

      await wait(240);
      resolve(sum);
    }

    function resolve(sum) {
      let returned = 0;
      const hits = [];
      const notes = [];
      const totalStake = staked();

      /* --- One-roll bets --- */
      if (oneRoll.field) {
        if ([3, 4, 9, 10, 11].includes(sum)) { returned += oneRoll.field * 2; hits.push('field'); notes.push('Field pays'); }
        else if (sum === 2 || sum === 12) { returned += oneRoll.field * 3; hits.push('field'); notes.push(`Field ${sum} pays double`); }
      }
      if (oneRoll.any7) {
        if (sum === 7) { returned += oneRoll.any7 * 5; hits.push('any7'); notes.push('Any seven pays 4 to 1'); }
      }
      oneRoll = { field: 0, any7: 0 };

      /* --- Line bets --- */
      let headline = '';
      if (point === null) {
        if (sum === 7 || sum === 11) {
          headline = `${sum} — a natural`;
          if (line.pass) { returned += line.pass * 2; hits.push('pass'); }
          line = { pass: 0, dont: 0 };
        } else if (sum === 2 || sum === 3) {
          headline = `${sum} — craps`;
          if (line.dont) { returned += line.dont * 2; hits.push('dont'); }
          line = { pass: 0, dont: 0 };
        } else if (sum === 12) {
          headline = '12 — craps, bar twelve';
          if (line.dont) { returned += line.dont; hits.push('dont'); }   // push
          line = { pass: 0, dont: 0 };
        } else {
          point = sum;
          headline = `Point is ${sum}`;
          puck.classList.add('moved');
          setTimeout(() => puck.classList.remove('moved'), 520);
        }
      } else {
        if (sum === point) {
          headline = `${sum} — point made`;
          if (line.pass) { returned += line.pass * 2; hits.push('pass'); }
          line = { pass: 0, dont: 0 };
          point = null;
        } else if (sum === 7) {
          headline = 'Seven out';
          if (line.dont) { returned += line.dont * 2; hits.push('dont'); }
          line = { pass: 0, dont: 0 };
          point = null;
        } else {
          headline = `${sum} — roll again`;
        }
      }

      hits.forEach(k => betNodes[k].btn.classList.add('hit'));
      if (returned > 0) Store.payout('craps', returned);

      // stake still on the table (an unresolved line bet) isn't a loss yet
      const resolvedStake = totalStake - (line.pass + line.dont);
      const net = Store.settle('craps', resolvedStake, returned, `Craps ${sum}`);

      say(notes.length ? `${headline} · ${notes[0]}` : headline);

      if (net > 0) {
        FX.pop(stage, `+${Store.fmt(net)}`, net >= resolvedStake * 4 ? 'jackpot' : 'win', '50%', '34%');
        if (net >= resolvedStake * 4) { FX.flash(stage); FX.burst(stage, { count: 40, y: 0.34 }); Sfx.bigwin(); }
        else { FX.burst(stage, { count: 16, y: 0.34 }); Sfx.win(); }
        Haptic.win();
      } else if (net < 0) {
        FX.pop(stage, `−${Store.fmt(-net)}`, 'lose', '50%', '34%');
        Sfx.lose(); Haptic.lose();
      } else if (point !== null && resolvedStake === 0) {
        Sfx.tick();
      }

      rolling = false;
      chip = Math.min(chip, Math.max(Store.ECON.MIN_BET, Store.balance));
      paint();
      if (Store.balance < Store.ECON.MIN_BET && staked() === 0) setTimeout(brokeSheet, 1200);
    }

    /* ---- Assemble ---- */
    const nav = gameNavbar('Craps', api.pop);
    const node = el('div', {}, [nav, el('div', { class: 'table' }, [stage, dock])]);
    say('Bet the pass line, then roll');
    paint();

    return { node, onPop: () => nav._unsub?.() };
  },
};

</script>

<script>
/* ==========================================================================
   Plinko — 12-row Galton board, 13 bins, three risk tiers.
   Each row is an independent 50/50, so bin odds are exactly binomial(12).
   Return to player: Low 98.98%, Medium 98.99%, High 99.12%.

   Pegs, ball and bins are all drawn on one canvas. Bins used to be HTML, which
   meant their width depended on flex layout and their text on the device's font
   settings — on iOS the labels inflated, overflowed their boxes and piled up.
   Sharing one coordinate system makes a landing position and its bin the same
   number by construction.
   ========================================================================== */

Games.plinko = {
  name: 'Plinko',
  glyph: '🔻',
  tint: '#5856D6',
  sub: '12 rows · up to 170×',

  build(api) {
    const ROWS = 12;
    const BINS = ROWS + 1;

    const RISK = {
      low:    { label: 'Low',    m: [10, 3, 1.6, 1.4, 1.1, 1, 0.5, 1, 1.1, 1.4, 1.6, 3, 10] },
      medium: { label: 'Medium', m: [33, 11, 4, 2, 1.1, 0.6, 0.3, 0.6, 1.1, 2, 4, 11, 33] },
      high:   { label: 'High',   m: [170, 24, 8.1, 2, 0.7, 0.2, 0.2, 0.2, 0.7, 2, 8.1, 24, 170] },
    };

    let risk = 'medium';
    let bet = Math.min(Store.ECON.DEFAULT_BET, Math.max(Store.ECON.MIN_BET, Store.balance));
    let balls = [];
    let raf = null;
    let lastPeg = 0;
    const flash = new Array(BINS).fill(-1e9);   // per-bin flash timestamps
    const FLASH_MS = 420;

    /* ======================= Canvas ======================= */
    const cv = el('canvas', { class: 'plinko__canvas' });
    const ctx = cv.getContext('2d');
    const board = el('div', { class: 'plinko__board' }, [cv]);

    let W = 340, H = 420, S = 26, ROW_H = 26, topY = 22, startY = 4, cx = 170;
    let pegR = 3.4, floorY = 400, binH = 20, binTop = 380, binFont = 10;

    function fit() {
      const r = board.getBoundingClientRect();
      // the backing store must match the displayed size, or everything squashes
      W = Math.max(1, r.width);
      H = Math.max(1, r.height);
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(W * dpr));
      cv.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      /* Spacing has to satisfy width and height together. 13 columns across,
         and enough vertical room for an entry gap, 12 rows and the bin strip. */
      const vGaps = ROWS - 1;
      const byWidth = W / BINS;
      const byHeight = H / (3.4 + 0.95 * vGaps);
      S = Math.max(5, Math.min(byWidth, byHeight));

      cx = W / 2;
      pegR = Math.max(1.6, S * 0.13);
      binH = clamp(S * 0.68, 15, 26);
      binFont = clamp(S * 0.34, 7.5, 11);
      binTop = H - binH;

      const entry = S * 0.85;
      const runout = S * 0.9;
      ROW_H = clamp((binTop - entry - runout) / vGaps, S * 0.5, S * 1.1);

      topY = Math.max(entry, (binTop - vGaps * ROW_H - runout) / 2 + entry * 0.35);

      // hard guarantee: the last row fits above the bins with room to fall out
      const maxLast = binTop - S * 0.55;
      if (topY + vGaps * ROW_H > maxLast) {
        ROW_H = Math.max(2, (maxLast - topY) / vGaps);
      }

      floorY = binTop + binH * 0.34;
      startY = Math.max(S * 0.24, topY - ROW_H * 0.6);

      draw();
    }

    /* ---- Geometry, all derived from the current size ---- */
    const xAt = (rowsDone, rights) => cx + (rights - rowsDone / 2) * S;
    const yAtRow = r => topY + (r - 1) * ROW_H;
    /** Centre of bin k — the same expression a ball lands on. */
    const binCentre = k => cx + (k - (BINS - 1) / 2) * S;

    function rightsBefore(ball, r) {
      let n = 0;
      for (let i = 0; i < r - 1; i++) n += ball.path[i];
      return n;
    }
    function segFrom(ball, i) {
      if (i === 0) return { x: cx, y: startY };
      return { x: xAt(i - 1, rightsBefore(ball, i)), y: yAtRow(i) };
    }
    function segTo(ball, i) {
      if (i === ROWS) return { x: binCentre(ball.bin), y: floorY };
      const r = i + 1;
      return { x: xAt(r - 1, rightsBefore(ball, r)), y: yAtRow(r) };
    }
    function segDuration(i) {
      if (i === ROWS) {
        const d = floorY - yAtRow(ROWS);
        return clamp(110 + (d / Math.max(1, S)) * 44, 130, 430);
      }
      return 128 / Math.sqrt(i + 1) + 52;
    }

    /* ======================= Painting ======================= */
    /** Multiplier to a hue/lightness pair: cool for low, hot for high. */
    function binTone(m) {
      const t = clamp(Math.log10(Math.max(0.2, m)) / Math.log10(170), 0, 1);
      return { h: 200 - t * 200, s: 85, l: 52 + t * 20 };
    }

    function roundRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, rr); return; }
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    /** Shrink or simplify a label until it fits the cell. */
    function labelFor(m, maxW) {
      const full = `${m}×`;
      ctx.font = `800 ${binFont}px -apple-system, system-ui, sans-serif`;
      if (ctx.measureText(full).width <= maxW) return { text: full, size: binFont };
      const bare = `${m}`;
      if (ctx.measureText(bare).width <= maxW) return { text: bare, size: binFont };
      let size = binFont;
      while (size > 6) {
        size -= 0.5;
        ctx.font = `800 ${size}px -apple-system, system-ui, sans-serif`;
        if (ctx.measureText(bare).width <= maxW) break;
      }
      return { text: bare, size };
    }

    function drawBins(now) {
      const mults = RISK[risk].m;
      const w = Math.max(4, S - 1.6);
      for (let k = 0; k < BINS; k++) {
        const c = binCentre(k);
        const t = clamp((now - flash[k]) / FLASH_MS, 0, 1);
        const active = t < 1;
        const lift = active ? Math.sin(t * Math.PI) * S * 0.2 : 0;
        const boost = active ? Math.sin(t * Math.PI) : 0;

        const tone = binTone(mults[k]);
        const y = binTop + lift;
        const h = binH - 2;

        roundRect(c - w / 2, y, w, h, Math.min(5, h * 0.3));
        ctx.fillStyle = `hsl(${tone.h} ${tone.s}% ${tone.l + boost * 26}%)`;
        ctx.fill();
        if (active) {
          ctx.strokeStyle = `rgba(255,255,255,${0.5 * boost})`;
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }

        const lab = labelFor(mults[k], w - 3);
        ctx.font = `800 ${lab.size}px -apple-system, system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(20,14,2,0.92)';
        ctx.fillText(lab.text, c, y + h / 2 + 0.5);
      }
    }

    function draw(now = performance.now()) {
      ctx.clearRect(0, 0, W, H);

      // funnel guides from the last peg row down to the bins
      const lastY = yAtRow(ROWS);
      const guideTop = lastY + ROW_H * 0.4;
      if (binTop - guideTop > 5) {
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for (let k = 0; k <= BINS; k++) {
          const x = cx + (k - BINS / 2) * S;
          ctx.beginPath();
          ctx.moveTo(x, guideTop);
          ctx.lineTo(x, binTop - 1);
          ctx.stroke();
        }
      }

      // pegs
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      for (let r = 1; r <= ROWS; r++) {
        const y = yAtRow(r);
        for (let j = 0; j < r; j++) {
          ctx.beginPath();
          ctx.arc(cx + (j - (r - 1) / 2) * S, y, pegR, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawBins(now);

      // balls last, so they ride over the bins as they land
      const br = Math.max(2, S * 0.2);
      for (const b of balls) {
        for (let i = 0; i < b.trail.length; i++) {
          const t = b.trail[i];
          const k = (i + 1) / b.trail.length;
          ctx.beginPath();
          ctx.arc(t.x, t.y, br * 0.85 * k, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(245,193,61,${0.05 + 0.16 * k})`;
          ctx.fill();
        }
        const g = ctx.createRadialGradient(b.x - br * 0.4, b.y - br * 0.4, br * 0.1, b.x, b.y, br);
        g.addColorStop(0, '#FFF6DA'); g.addColorStop(0.55, '#F7CE5B'); g.addColorStop(1, '#C08D14');
        ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
      }
    }

    /* ======================= Drops ======================= */
    function drop() {
      if (!Store.canBet(bet)) {
        if (Store.balance < Store.ECON.MIN_BET) brokeSheet();
        else toast(`You only have ${Store.fmt(Store.balance)}`);
        return;
      }
      const staked = Store.wager('plinko', bet);
      if (!staked) return;

      const path = Array.from({ length: ROWS }, () => Math.random() < 0.5 ? 0 : 1);
      const bin = path.reduce((a, b) => a + b, 0);

      balls.push({
        path, bin, staked,
        // captured now, so switching risk mid-flight can't re-price this ball
        mult: RISK[risk].m[bin],
        seg: 0,
        t0: performance.now(),
        x: cx, y: startY,
        trail: [],
      });

      Sfx.chip(); Haptic.tap();
      controls();
      if (!raf) loop();
    }

    const flashPending = now => flash.some(t => now - t < FLASH_MS);

    function loop() {
      raf = requestAnimationFrame(loop);
      const now = performance.now();

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        const from = segFrom(b, b.seg);
        const to = segTo(b, b.seg);
        const k = clamp((now - b.t0) / segDuration(b.seg), 0, 1);

        b.x = from.x + (to.x - from.x) * k;
        // a small kick off the peg then gravity; capped against peg spacing so
        // the long run-out into the bins doesn't launch the ball back up
        const fall = to.y - from.y;
        const u = b.seg === 0 ? 0 : Math.min(fall * 0.65, S * 0.7);
        b.y = from.y - u * k + (fall + u) * k * k;

        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 9) b.trail.shift();

        if (k >= 1) {
          b.x = to.x; b.y = to.y;
          b.seg++;
          b.t0 = now;
          if (b.seg <= ROWS) {
            // many balls at once would otherwise stack up dozens of
            // oscillators a second and stutter the audio
            if (now - lastPeg > 40) { lastPeg = now; Sfx.peg(); }
            if (b.seg % 5 === 0) Haptic.tap();
          } else {
            land(b, now);
            balls.splice(i, 1);
          }
        }
      }

      draw(now);
      if (!balls.length && !flashPending(now)) { cancelAnimationFrame(raf); raf = null; }
    }

    function land(b, now) {
      const mult = b.mult;
      const returned = Math.round(b.staked * mult);
      if (returned > 0) Store.payout('plinko', returned);
      const net = Store.settle('plinko', b.staked, returned, `Plinko ${mult}×`);

      flash[b.bin] = now;

      const xFrac = clamp(binCentre(b.bin) / Math.max(1, W), 0.1, 0.9);
      const xPct = `${(xFrac * 100).toFixed(1)}%`;
      const popY = `${clamp(((binTop - S * 1.6) / Math.max(1, H)) * 100, 25, 78).toFixed(1)}%`;

      if (mult >= 10) {
        say(`${mult}× — big one`);
        FX.flash(stage);
        FX.pop(stage, `+${Store.fmt(net)}`, 'jackpot', xPct, popY);
        FX.burst(stage, { count: mult >= 33 ? 50 : 32, x: xFrac, y: 0.72 });
        Sfx.bigwin(); Haptic.win();
      } else if (net > 0) {
        say(`${mult}×`);
        FX.pop(stage, `+${Store.fmt(net)}`, 'win', xPct, popY);
        Sfx.win(); Haptic.light();
      } else {
        say(`${mult}×`);
        FX.pop(stage, `−${Store.fmt(-net)}`, 'lose', xPct, popY);
        Sfx.lose();
      }

      bet = Math.min(bet, Math.max(Store.ECON.MIN_BET, Store.balance));
      controls();
      if (Store.balance < Store.ECON.MIN_BET && !balls.length) setTimeout(brokeSheet, 1100);
    }

    /* ======================= Chrome ======================= */
    const stage = el('div', { class: 'table__stage' });
    const msg = el('div', { class: 'table__msg' });

    const seg = el('div', { class: 'seg' }, Object.entries(RISK).map(([k, v]) =>
      el('button', {
        class: 'seg__item',
        text: v.label,
        role: 'tab',
        'aria-selected': k === risk ? 'true' : 'false',
        onclick: e => {
          risk = k;
          $$('.seg__item', seg).forEach(n => n.setAttribute('aria-selected', 'false'));
          e.currentTarget.setAttribute('aria-selected', 'true');
          Sfx.click(); Haptic.tap();
          say(balls.length ? `${v.label} risk — balls in the air keep their old odds` : `${v.label} risk`);
          draw();
        },
      })
    ));

    stage.append(msg, el('div', { class: 'plinko' }, [
      el('div', { class: 'plinko__risk' }, [seg]),
      board,
    ]));

    const stepper = betStepper(() => bet, v => bet = v);
    const bDrop = el('button', { class: 'gbtn gbtn--gold', onclick: drop }, [el('span', { text: 'Drop' })]);
    const dock = el('div', { class: 'dock' }, [stepper, el('div', { class: 'dock__row' }, [bDrop])]);

    function controls() {
      stepper._refresh?.();
      bDrop.disabled = !Store.canBet(bet);
    }
    function say(t, flashMsg = true) {
      msg.textContent = t;
      if (flashMsg) { msg.classList.remove('flash'); void msg.offsetWidth; msg.classList.add('flash'); }
    }

    /* ---- Assemble ---- */
    const nav = gameNavbar('Plinko', api.pop);
    const node = el('div', {}, [nav, el('div', { class: 'table' }, [stage, dock])]);

    const ro = new ResizeObserver(fit);
    requestAnimationFrame(() => { fit(); ro.observe(board); });
    say('Drop a ball — stack them up');
    controls();

    return {
      node,
      onPop: () => { nav._unsub?.(); ro.disconnect(); if (raf) cancelAnimationFrame(raf); balls = []; },
    };
  },
};

</script>

<script>
/* ==========================================================================
   Manna — app shell: Casino, Verse, Wallet
   ========================================================================== */

(function boot() {
  Store.load();

  /* ======================================================================
     CASINO TAB
     ====================================================================== */
  const ORDER = ['blackjack', 'slots', 'roulette', 'craps', 'plinko'];

  const walletCard = el('div', { class: 'wallet' });
  function paintWallet() {
    const s = Store.state;
    walletCard.innerHTML = '';
    walletCard.append(
      el('div', { class: 'wallet__label', text: 'Balance' }),
      el('div', { class: 'wallet__amt money' }, [
        el('span', { text: Store.fmt(s.balance) }),
        el('small', { text: 'COINS' }),
      ]),
      el('div', { class: 'wallet__foot' }, [
        el('div', {}, [el('b', { class: 'money', text: Store.fmt(s.stats.hands) }), 'Rounds played']),
        el('div', {}, [el('b', { class: 'money', text: Store.fmt(s.versesRead) }), 'Verses read']),
        el('div', {}, [el('b', { class: 'money', text: Store.fmt(s.stats.bestWin) }), 'Best win']),
      ]),
    );
  }

  const gameList = el('div', { class: 'list' }, ORDER.map(key => {
    const g = Games[key];
    return el('button', { class: 'row has-icon', onclick: () => openGame(key) }, [
      el('div', { class: 'row__icon', style: `background:${g.tint}`, text: g.glyph }),
      el('div', { class: 'row__body' }, [
        el('span', { class: 'row__title', text: g.name }),
        el('span', { class: 'row__sub', text: g.sub }),
      ]),
      el('span', { html: Icon.chevron }).firstChild,
    ]);
  }));

  const casinoScreen = el('div', { class: 'screen' }, [
    el('div', { class: 'navbar' }, [el('h1', { class: 'navbar__title', text: 'Manna' })]),
    el('div', { class: 'scroll' }, [
      el('h1', { class: 'largetitle', text: 'Casino' }),
      el('p', { class: 'largetitle__sub', text: 'Play on faith. Coins have no cash value.' }),
      walletCard,
      el('div', { class: 'group' }, [
        el('div', { class: 'group__hdr', text: 'Games' }),
        gameList,
        el('div', {
          class: 'group__ftr',
          text: `Coins come from two places: your daily provision of ${Store.fmt(Store.ECON.DAILY)}, and ${Store.fmt(Store.ECON.VERSE)} for each verse you read.`,
        }),
      ]),
    ]),
  ]);

  function openGame(key) {
    Sfx.unlock();
    if (Store.balance < Store.ECON.MIN_BET) { brokeSheet(); return; }
    Nav.push(api => Games[key].build(api));
  }

  /* ======================================================================
     VERSE TAB
     ====================================================================== */
  const READ = { BASE_MS: 8000, PER_WORD_MS: 500, MIN_MS: 15000, MAX_MS: 35000 };

  let verse = null;          // { ref, text }
  let readState = 'idle';    // idle | reading | ready | claimed
  let needMs = 0, doneMs = 0, lastTick = 0, readRaf = null;

  const dailyTile = el('div', { class: 'daily' });
  const verseHost = el('div');

  const verseScreen = el('div', { class: 'screen' }, [
    el('div', { class: 'navbar' }, [el('h1', { class: 'navbar__title', text: 'Verse' })]),
    el('div', { class: 'scroll' }, [
      el('h1', { class: 'largetitle', text: 'Provision' }),
      el('p', { class: 'largetitle__sub', text: 'Coins are earned, not bought.' }),
      dailyTile,
      verseHost,
    ]),
  ]);

  /* ---------- Daily bonus ---------- */
  let dailyTimer = null;
  function paintDaily() {
    clearInterval(dailyTimer);
    dailyTile.innerHTML = '';

    if (Store.dailyReady()) {
      dailyTile.append(
        el('div', { class: 'daily__glyph', text: '🍞' }),
        el('div', { class: 'daily__title', text: 'Daily provision' }),
        el('div', { class: 'daily__text', text: `${Store.fmt(Store.ECON.DAILY)} coins, once a day. Enough for a few honest hands.` }),
        el('button', {
          class: 'btn btn--gold btn--full',
          text: `Claim ${Store.fmt(Store.ECON.DAILY)}`,
          onclick: claimDaily,
        }),
      );
    } else {
      const s = Store.state;
      const cd = el('div', { class: 'daily__timer' });
      dailyTile.append(
        el('div', { class: 'daily__glyph', text: '✓' }),
        el('div', { class: 'daily__title', text: 'Claimed today' }),
        el('div', {
          class: 'daily__text',
          text: s.dailyStreak > 1 ? `${s.dailyStreak} days running.` : 'Come back tomorrow for more.',
        }),
        cd,
      );
      const tick = () => {
        const ms = Store.msUntilTomorrow();
        const h = Math.floor(ms / 3600000);
        const m = Math.floor(ms / 60000) % 60;
        const sec = Math.floor(ms / 1000) % 60;
        cd.textContent = `Next in ${h}h ${String(m).padStart(2, '0')}m ${String(sec).padStart(2, '0')}s`;
        if (ms <= 1000) { paintDaily(); paintBadge(); }
      };
      tick();
      dailyTimer = setInterval(tick, 1000);
    }
  }

  function claimDaily() {
    Sfx.unlock();
    const got = Store.claimDaily();
    if (!got) return;
    Sfx.reward(); Haptic.win();
    toast(`+${Store.fmt(got)} daily provision`, 'win');
    FX.burst(dailyTile, { count: 26, y: 0.4 });
    paintDaily();
    paintWallet();
    paintBadge();
  }

  /* ---------- Verse reader ---------- */
  function readingTimeFor(text) {
    const words = text.trim().split(/\s+/).length;
    return clamp(READ.BASE_MS + words * READ.PER_WORD_MS, READ.MIN_MS, READ.MAX_MS);
  }

  function drawVerse() {
    const i = Store.nextVerseIndex(VERSES.length);
    const [ref, text] = VERSES[i];
    verse = { ref, text };
    needMs = readingTimeFor(text);
    doneMs = 0;
    readState = 'reading';
    paintVerse();
    startTimer();
    Sfx.click(); Haptic.tap();
  }

  function startTimer() {
    cancelAnimationFrame(readRaf);
    lastTick = performance.now();
    const step = now => {
      const dt = now - lastTick;
      lastTick = now;
      // only count time while the app is actually in front
      if (!document.hidden && Nav.depth === 0) doneMs = Math.min(needMs, doneMs + dt);
      updateRing();
      if (doneMs >= needMs) {
        if (readState === 'reading') {
          readState = 'ready';
          // only refresh the ring and button — rebuilding would re-animate the verse
          updateRing();
          Sfx.tick(); Haptic.light();
        }
        return;
      }
      readRaf = requestAnimationFrame(step);
    };
    readRaf = requestAnimationFrame(step);
  }

  let ringFill = null, ringNum = null, ringCopy = null, claimBtn = null;
  const RING_R = 23;
  const RING_C = 2 * Math.PI * RING_R;

  function updateRing() {
    if (!ringFill) return;
    const k = clamp(doneMs / needMs, 0, 1);
    ringFill.setAttribute('stroke-dashoffset', String(RING_C * (1 - k)));
    ringFill.classList.toggle('done', k >= 1);
    const left = Math.ceil((needMs - doneMs) / 1000);
    if (k >= 1) {
      ringNum.textContent = '✓';
      ringCopy.innerHTML = '';
      ringCopy.append(
        el('b', { text: 'Ready' }),
        el('span', { text: `Collect ${Store.fmt(Store.ECON.VERSE)} coins.` }),
      );
      if (claimBtn) { claimBtn.disabled = false; claimBtn.textContent = `Collect ${Store.fmt(Store.ECON.VERSE)}`; }
    } else {
      ringNum.textContent = String(left);
      if (claimBtn) claimBtn.textContent = `Reading… ${left}s`;
    }
  }

  function paintVerse() {
    verseHost.innerHTML = '';
    ringFill = ringNum = ringCopy = claimBtn = null;

    if (readState === 'idle') {
      verseHost.append(
        el('div', { class: 'card' }, [
          el('div', { style: 'text-align:center' }, [
            el('div', { style: 'font-size:38px', text: '📖' }),
            el('div', { style: 'font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.02em', text: 'Read a verse' }),
            el('p', {
              style: 'font-size:15px;color:var(--label-secondary);margin:5px 0 16px;line-height:1.4',
              text: `${Store.fmt(Store.ECON.VERSE)} coins per verse, as many as you like. The timer runs only while the verse is on screen.`,
            }),
            el('button', { class: 'btn btn--filled btn--full', text: 'Draw a verse', onclick: drawVerse }),
          ]),
        ]),
        el('div', { class: 'group' }, [
          el('div', { class: 'group__ftr', text: `${Store.fmt(VERSES.length)} verses loaded, King James Version. ${Store.state.versesToday} read today.` }),
        ]),
      );
      return;
    }

    if (readState === 'claimed') {
      verseHost.append(
        el('div', { class: 'reward' }, [
          el('div', { class: 'reward__amt money', text: `+${Store.fmt(Store.ECON.VERSE)}` }),
          el('div', { class: 'reward__lbl', text: verse.ref }),
        ]),
        el('div', { class: 'group' }, [
          el('div', { class: 'list' }, [
            el('button', { class: 'row', onclick: drawVerse }, [
              el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Read another verse' })]),
              el('span', { html: Icon.chevron }).firstChild,
            ]),
            el('button', { class: 'row', onclick: () => Nav.selectTab('casino') }, [
              el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Back to the casino' })]),
              el('span', { html: Icon.chevron }).firstChild,
            ]),
          ]),
        ]),
      );
      return;
    }

    /* reading | ready */
    const ready = readState === 'ready';
    ringFill = el('circle', {});
    // build the SVG by hand so namespaces are right
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'ring__svg');
    svg.setAttribute('viewBox', '0 0 52 52');
    const mk = (cls) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', '26'); c.setAttribute('cy', '26'); c.setAttribute('r', String(RING_R));
      c.setAttribute('class', cls);
      return c;
    };
    const track = mk('ring__track');
    ringFill = mk('ring__fill');
    ringFill.setAttribute('stroke-dasharray', String(RING_C));
    ringFill.setAttribute('stroke-dashoffset', String(RING_C));
    svg.append(track, ringFill);

    ringNum = el('span', { class: 'ring__num tnum', text: '—' });
    ringCopy = el('div', { class: 'ring__copy' }, [
      el('b', { text: 'Take your time' }),
      el('span', { text: 'The timer pauses if you leave this screen.' }),
    ]);

    claimBtn = el('button', {
      class: 'btn btn--gold btn--full',
      text: 'Reading…',
      disabled: !ready,
      onclick: collect,
    });

    verseHost.append(
      el('div', { class: 'verse' }, [
        el('div', { class: 'verse__ref', text: verse.ref }),
        el('p', { class: 'verse__text in', text: verse.text }),
        el('div', { class: 'ring' }, [
          el('div', { class: 'ring__wrap' }, [svg, ringNum]),
          ringCopy,
        ]),
      ]),
      el('div', { style: 'margin:0 var(--gutter) 12px' }, [claimBtn]),
      el('div', { class: 'group' }, [
        el('div', { class: 'list' }, [
          el('button', { class: 'row', onclick: () => { cancelAnimationFrame(readRaf); readState = 'idle'; paintVerse(); } }, [
            el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Not this one — draw again' })]),
            el('span', { html: Icon.chevron }).firstChild,
          ]),
        ]),
      ]),
    );
    updateRing();
  }

  function collect() {
    if (readState !== 'ready') return;
    Sfx.unlock();
    const got = Store.rewardVerse(verse.ref);
    readState = 'claimed';
    paintVerse();
    paintWallet();
    Sfx.reward(); Haptic.win();
    toast(`+${Store.fmt(got)} for ${verse.ref}`, 'win');
    const host = $('.reward', verseHost);
    if (host) FX.burst(host, { count: 30, y: 0.5 });
  }

  /* ======================================================================
     WALLET TAB
     ====================================================================== */
  const walletHost = el('div');
  const walletScreen = el('div', { class: 'screen' }, [
    el('div', { class: 'navbar' }, [el('h1', { class: 'navbar__title', text: 'Wallet' })]),
    el('div', { class: 'scroll' }, [
      el('h1', { class: 'largetitle', text: 'Wallet' }),
      walletHost,
    ]),
  ]);

  const GAME_NAMES = { blackjack: 'Blackjack', slots: 'Slots', roulette: 'Roulette', craps: 'Craps', plinko: 'Plinko' };

  function statRow(label, value) {
    return el('div', { class: 'row' }, [
      el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: label })]),
      el('span', { class: 'row__value money', text: value }),
    ]);
  }

  function paintWalletTab() {
    const s = Store.state;
    walletHost.innerHTML = '';

    walletHost.append(
      el('div', { class: 'wallet' }, [
        el('div', { class: 'wallet__label', text: 'Balance' }),
        el('div', { class: 'wallet__amt money' }, [
          el('span', { text: Store.fmt(s.balance) }),
          el('small', { text: 'COINS' }),
        ]),
        el('div', { class: 'wallet__foot' }, [
          el('div', {}, [el('b', { class: 'money', text: Store.fmt(s.stats.earned) }), 'Total earned']),
          el('div', {}, [el('b', { class: 'money', text: Store.fmt(s.stats.wagered) }), 'Total wagered']),
        ]),
      ]),
    );

    const net = s.stats.won - s.stats.wagered;
    walletHost.append(el('div', { class: 'group' }, [
      el('div', { class: 'group__hdr', text: 'Lifetime' }),
      el('div', { class: 'list' }, [
        statRow('Rounds played', Store.fmt(s.stats.hands)),
        statRow('Wagered', Store.fmt(s.stats.wagered)),
        statRow('Returned', Store.fmt(s.stats.won)),
        el('div', { class: 'row' }, [
          el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Net' })]),
          el('span', { class: `row__value money ${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}`, text: `${net > 0 ? '+' : net < 0 ? '−' : ''}${Store.fmt(Math.abs(net))}` }),
        ]),
        statRow('Best single win', Store.fmt(s.stats.bestWin)),
        statRow('Verses read', Store.fmt(s.versesRead)),
        statRow('Daily streak', `${s.dailyStreak} ${s.dailyStreak === 1 ? 'day' : 'days'}`),
      ]),
    ]));

    const played = Object.entries(s.stats.byGame).filter(([, g]) => g.hands > 0);
    if (played.length) {
      walletHost.append(el('div', { class: 'group' }, [
        el('div', { class: 'group__hdr', text: 'By game' }),
        el('div', { class: 'list' }, played.map(([k, g]) => {
          const n = g.won - g.wagered;
          return el('div', { class: 'row' }, [
            el('div', { class: 'row__body' }, [
              el('span', { class: 'row__title', text: GAME_NAMES[k] || k }),
              el('span', { class: 'row__sub', text: `${Store.fmt(g.hands)} rounds · ${Store.fmt(g.wagered)} wagered` }),
            ]),
            el('span', { class: `row__value money ${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}`, text: `${n > 0 ? '+' : n < 0 ? '−' : ''}${Store.fmt(Math.abs(n))}` }),
          ]);
        })),
      ]));
    }

    /* History */
    if (s.ledger.length) {
      walletHost.append(el('div', { class: 'group' }, [
        el('div', { class: 'group__hdr', text: 'Recent activity' }),
        el('div', { class: 'list' }, s.ledger.slice(0, 25).map(e => {
          const t = new Date(e.at);
          const time = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          const day = t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          return el('div', { class: 'row' }, [
            el('div', { class: 'row__body' }, [
              el('span', { class: 'row__title', text: e.label }),
              el('span', { class: 'row__sub', text: `${day} at ${time}` }),
            ]),
            el('span', {
              class: `row__value money ${e.delta > 0 ? 'pos' : e.delta < 0 ? 'neg' : ''}`,
              text: `${e.delta > 0 ? '+' : e.delta < 0 ? '−' : '±'}${Store.fmt(Math.abs(e.delta))}`,
            }),
          ]);
        })),
      ]));
    } else {
      walletHost.append(el('div', { class: 'empty' }, [
        el('div', { class: 'empty__glyph', text: '🧾' }),
        el('div', { class: 'empty__title', text: 'No activity yet' }),
        el('div', { class: 'empty__text', text: 'Claim your daily provision and play a hand.' }),
      ]));
    }

    /* Settings */
    walletHost.append(el('div', { class: 'group' }, [
      el('div', { class: 'group__hdr', text: 'Settings' }),
      el('div', { class: 'list' }, [
        el('button', { class: 'row', onclick: e => {
          const on = Store.toggleSound();
          Sfx.unlock(); if (on) Sfx.click();
          $('.row__value', e.currentTarget).textContent = on ? 'On' : 'Off';
        }}, [
          el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Sound' })]),
          el('span', { class: 'row__value', text: s.sound ? 'On' : 'Off' }),
        ]),
        el('button', { class: 'row', onclick: showInstall }, [
          el('div', { class: 'row__body' }, [el('span', { class: 'row__title', text: 'Add to Home Screen' })]),
          el('span', { html: Icon.chevron }).firstChild,
        ]),
        el('button', { class: 'row', onclick: confirmReset }, [
          el('div', { class: 'row__body' }, [
            el('span', { class: 'row__title', style: 'color:var(--sys-red)', text: 'Start over' }),
          ]),
        ]),
      ]),
      el('div', { class: 'group__ftr', text: 'Coins are made up. They cannot be bought, sold, or cashed out — the only ways in are the daily provision and reading verses.' }),
    ]));
  }

  function confirmReset() {
    sheet({
      title: 'Start over?',
      text: 'This erases your balance, stats, and history on this device. It cannot be undone.',
      actions: [
        { label: 'Erase everything', style: 'danger', onSelect: () => {
          Store.reset();
          readState = 'idle'; verse = null;
          cancelAnimationFrame(readRaf);
          paintAll();
          toast('Starting fresh');
        }},
        { label: 'Cancel', style: 'cancel' },
      ],
    });
  }

  function showInstall() {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    sheet({
      title: 'Add to Home Screen',
      text: ios
        ? 'Tap the Share button in Safari, scroll down, then choose "Add to Home Screen". Manna will open full screen with no browser chrome.'
        : 'Open your browser menu and choose "Install app" or "Add to Home Screen".',
      actions: [{ label: 'Got it', style: 'cancel' }],
    });
  }

  /* ======================================================================
     Tabs + wiring
     ====================================================================== */
  const tabDefs = [
    { key: 'casino', label: 'Casino', icon: Icon.tabCasino, screen: casinoScreen },
    { key: 'verse',  label: 'Verse',  icon: Icon.tabVerse,  screen: verseScreen },
    { key: 'wallet', label: 'Wallet', icon: Icon.tabWallet, screen: walletScreen },
  ];

  const tabbar = $('#tabbar');
  const screensHost = $('#screens');
  const tabMap = {};
  let verseBadge = null;

  tabDefs.forEach(t => {
    screensHost.appendChild(t.screen);
    const btn = el('button', {
      class: 'tab',
      role: 'tab',
      'aria-selected': 'false',
      'aria-label': t.label,
      onclick: () => Nav.selectTab(t.key),
    }, [
      el('span', { html: t.icon }).firstChild,
      el('span', { text: t.label }),
    ]);
    if (t.key === 'verse') {
      verseBadge = el('span', { class: 'tab__badge', hidden: true });
      btn.appendChild(verseBadge);
    }
    tabbar.appendChild(btn);
    tabMap[t.key] = {
      button: btn,
      screen: t.screen,
      onShow: t.key === 'verse' ? () => { paintDaily(); paintVerse(); if (readState === 'reading') startTimer(); }
            : t.key === 'wallet' ? paintWalletTab
            : paintWallet,
      onHide: t.key === 'verse' ? () => { clearInterval(dailyTimer); cancelAnimationFrame(readRaf); } : null,
    };
  });

  Nav.registerTabs(tabMap);

  function paintBadge() {
    if (verseBadge) verseBadge.hidden = !Store.dailyReady();
  }

  function paintAll() {
    paintWallet();
    paintDaily();
    paintVerse();
    paintWalletTab();
    paintBadge();
  }

  Store.sub(() => {
    paintWallet();
    paintBadge();
    if (tabMap.wallet.screen.hidden === false) paintWalletTab();
  });

  /* Pause the reading timer when the app goes to the background */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(readRaf);
    else if (readState === 'reading') startTimer();
  });

  /* Unlock audio on the first real gesture */
  const unlock = () => { Sfx.unlock(); window.removeEventListener('pointerdown', unlock); };
  window.addEventListener('pointerdown', unlock, { once: true });

  /* Swipe-from-left-edge to go back, like iOS */
  let tStartX = 0, tStartY = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    tracking = Nav.depth > 0 && t.clientX < 28;
    tStartX = t.clientX; tStartY = t.clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    if (t.clientX - tStartX > 62 && Math.abs(t.clientY - tStartY) < 56) Nav.pop();
  }, { passive: true });

  /* Go */
  paintAll();
  Nav.selectTab('casino');

  if (Store.dailyReady()) {
    setTimeout(() => toast(`Your daily ${Store.fmt(Store.ECON.DAILY)} is waiting in Verse`), 900);
  }

  /* No service worker: this is the single-file build, every asset
     is already inlined, so there is nothing to precache and no
     separate worker file to register. */
})();

</script>

</body>
</html>
